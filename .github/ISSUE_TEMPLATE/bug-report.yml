name: Bug report
description: Report a reproducible client, server, recipe, tag, quest, or compatibility problem.
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: pack-version
    attributes:
      label: Pack version
      placeholder: 0.1.9-13
    validations:
      required: true
  - type: dropdown
    id: side
    attributes:
      label: Where did it happen?
      options:
        - Client
        - Dedicated server
        - Client and server
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include the smallest repeatable sequence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Paired logs and evidence
      description: Attach client and server logs from the same session. Remove credentials, player data, and private addresses.
    validations:
      required: true
