name: Package Amber & Arcana 0.1.9-46

on:
  push:
    branches:
      - experiment/morehitboxes-perf-v2
    paths:
      - .github/workflows/package-0.1.9-46.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout experiment branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare 0.1.9-46 package metadata and Crafty manifest
        shell: bash
        run: |
          set -euo pipefail

          JAR='morehitboxes-forge-1.20.1-1.9.2.2.jar'
          EXPECTED_SHA512='11d56077d1ee93798f8925a550a99155a790a51f620a661c527076cfb3deed508ea1b2580ca2e5d7dd2c1064906907dcc2d6bc519b940e447cf714ffa3acd699'

          test -f "client/overrides/mods/$JAR"
          test -f "server/mods/$JAR"
          printf '%s  %s\n' "$EXPECTED_SHA512" "client/overrides/mods/$JAR" | sha512sum -c -
          printf '%s  %s\n' "$EXPECTED_SHA512" "server/mods/$JAR" | sha512sum -c -
          cmp -s "client/overrides/mods/$JAR" "server/mods/$JAR"

          rm -f \
            client/overrides/mods/morehitboxes-forge-1.20.1-1.9.2.jar \
            client/overrides/mods/morehitboxes-forge-1.20.1-1.9.2.1.jar \
            server/mods/morehitboxes-forge-1.20.1-1.9.2.jar \
            server/mods/morehitboxes-forge-1.20.1-1.9.2.1.jar

          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          version = '0.1.9-46'
          jar = 'morehitboxes-forge-1.20.1-1.9.2.2.jar'
          sha512 = '11d56077d1ee93798f8925a550a99155a790a51f620a661c527076cfb3deed508ea1b2580ca2e5d7dd2c1064906907dcc2d6bc519b940e447cf714ffa3acd699'

          # The patched More Hitboxes JAR is bundled locally. It must never be
          # represented as a fake CurseForge fileID/projectID 0 download.
          tsv = Path('server/_crafty/server-mods.tsv')
          kept = []
          removed = []
          for line in tsv.read_text(encoding='utf-8').splitlines():
              if not line or line.startswith('#'):
                  kept.append(line)
                  continue
              fields = line.split('\t')
              filename = fields[1] if len(fields) > 1 else ''
              slug = fields[3] if len(fields) > 3 else ''
              if filename.startswith('morehitboxes-forge-1.20.1-') or slug == 'more-hitboxes':
                  removed.append(line)
                  continue
              kept.append(line)
          tsv.write_text('\n'.join(kept) + '\n', encoding='utf-8')
          print(f'Removed {len(removed)} More Hitboxes downloader row(s)')

          # Client metadata.
          manifest_path = Path('client/manifest.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['name'] = f'Amber & Arcana {version}'
          manifest['version'] = version
          manifest_path.write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')

          # Server package metadata.
          summary_path = Path('server/_crafty/build-summary.json')
          summary = json.loads(summary_path.read_text(encoding='utf-8'))
          managed_count = 0
          for line in tsv.read_text(encoding='utf-8').splitlines():
              if line and not line.startswith('#'):
                  managed_count += 1
          summary['pack_version'] = version
          summary['server_mod_downloads'] = managed_count
          summary['server_mod_count'] = managed_count
          summary['more_hitboxes_0_1_9_46'] = {
              'filename': jar,
              'distribution': 'bundled-local-jar',
              'server_mods_tsv_entry': False,
              'sha512': sha512,
              'reason': 'Prevent Crafty launcher from interpreting a local patched JAR as CurseForge file ID 0.'
          }
          summary_path.write_text(json.dumps(summary, indent=2) + '\n', encoding='utf-8')

          validation_path = Path('server/pack-information/validation.json')
          validation = json.loads(validation_path.read_text(encoding='utf-8'))
          validation['pack_version'] = version
          patch = validation.setdefault('more_hitboxes_perf_patch_0_1_9_46', {})
          patch.update({
              'enabled': True,
              'filename': jar,
              'sha512': sha512,
              'typed_entity_query_hook_removed': True,
              'ordinary_entity_query_hooks_preserved': True,
              'multipart_position_unchanged_fast_path_preserved': True,
              'server_mods_tsv_entry': False,
              'bundled_client_and_server': True,
              'crafty_file_id_zero_bug_fixed': True,
              'runtime_retest_required': True
          })
          validation_path.write_text(json.dumps(validation, indent=2) + '\n', encoding='utf-8')

          # Update static validator without changing historical 0.1.9-45 quest markers.
          validate_path = Path('scripts/validate.sh')
          text = validate_path.read_text(encoding='utf-8')
          text = text.replace('.version == "0.1.9-45" and .minecraft.version', '.version == "0.1.9-46" and .minecraft.version', 1)
          text = text.replace('.pack_version == "0.1.9-45" and .recipe_viewer', '.pack_version == "0.1.9-46" and .recipe_viewer', 1)
          text = text.replace('echo "Amber & Arcana 0.1.9-45 static validation passed"', 'echo "Amber & Arcana 0.1.9-46 static validation passed"', 1)
          lines = []
          replaced_pin = False
          for line in text.splitlines():
              if 'Expected local More Hitboxes patch pin' in line:
                  lines.append("test \"$(awk -F '\\t' '$4 == \"more-hitboxes\" || $2 ~ /^morehitboxes-forge-1\\.20\\.1-/ {n++} END {print n+0}' \"$repo_dir/server/_crafty/server-mods.tsv\")\" = \"0\" || { echo \"More Hitboxes must be bundled locally, not listed in server-mods.tsv\" >&2; exit 1; }")
                  replaced_pin = True
              else:
                  lines.append(line)
          if not replaced_pin:
              raise SystemExit('Could not locate old local More Hitboxes TSV validation')
          validate_path.write_text('\n'.join(lines) + '\n', encoding='utf-8')

          # Current download links and install text.
          readme_path = Path('README.md')
          readme = readme_path.read_text(encoding='utf-8')
          readme = re.sub(
              r'\[Download Client [^\]]+\]\([^\)]+\) · \[Download Crafty Server [^\]]+\]\([^\)]+\) · \[Update existing Crafty server\]\([^\)]+\)',
              '[Download Client 0.1.9-46](https://github.com/skullrider0/Amber-Arcana/raw/refs/heads/main/dist/Amber-and-Arcana-0.1.9-46-Client.zip) · [Download Crafty Server 0.1.9-46](https://github.com/skullrider0/Amber-Arcana/raw/refs/heads/main/dist/Amber-and-Arcana-0.1.9-46-Server.zip) · [Update existing Crafty server](https://github.com/skullrider0/Amber-Arcana/raw/refs/heads/main/dist/Amber-and-Arcana-0.1.9-46-Crafty-Update-Overlay.zip)',
              readme,
              count=1,
          )
          readme = readme.replace('| Pack | 0.1.9-45 |', '| Pack | 0.1.9-46 |', 1)
          readme = readme.replace('Import `dist/Amber-and-Arcana-0.1.9-44-Client.zip`', 'Import `dist/Amber-and-Arcana-0.1.9-46-Client.zip`', 1)
          readme = readme.replace('Create a fresh server from `dist/Amber-and-Arcana-0.1.9-44-Server.zip`', 'Create a fresh server from `dist/Amber-and-Arcana-0.1.9-46-Server.zip`', 1)
          readme = readme.replace('extract `dist/Amber-and-Arcana-0.1.9-44-Crafty-Update-Overlay.zip`', 'extract `dist/Amber-and-Arcana-0.1.9-46-Crafty-Update-Overlay.zip`', 1)
          marker = 'Release 0.1.9-25 keeps JEI'
          note = ('Release 0.1.9-46 ships More Hitboxes 1.9.2.2 as an identical local JAR on client and server. '
                  'The Crafty downloader manifest contains no More Hitboxes row, fixing the `Unexpected CurseForge file ID: 0` startup failure while preserving the Fossils dependency.\n\n')
          if note not in readme:
              readme = readme.replace(marker, note + marker, 1)
          readme_path.write_text(readme, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          entry = '''## 0.1.9-46\n- Upgrade the bundled Amber More Hitboxes performance patch to 1.9.2.2 on both client and server.\n- Remove More Hitboxes from `server/_crafty/server-mods.tsv`; the patched JAR is local and must not be treated as CurseForge file ID 0.\n- Preserve the Fossils dependency and official client mixin/refmap while removing the Spark-identified global typed entity-query hotspot.\n- Publish matching client/server ZIPs and a world-safe Crafty update overlay. Runtime Fossils hitbox and Spark re-test is still required.\n\n'''
          if not changelog.startswith('## 0.1.9-46\n'):
              changelog_path.write_text(entry + changelog, encoding='utf-8')
          PY

          # Reject every fake CurseForge file ID 0, not just More Hitboxes.
          if awk -F '\t' '$1 == "0" {print; bad=1} END {exit bad ? 0 : 1}' server/_crafty/server-mods.tsv; then
            echo 'server-mods.tsv still contains fileID 0 rows' >&2
            exit 1
          fi
          ! grep -Fq 'more-hitboxes' server/_crafty/server-mods.tsv
          ! grep -Fq 'morehitboxes-forge-1.20.1-' server/_crafty/server-mods.tsv
          grep -Fxq 'morehitboxes-forge-1.20.1-1.9.2.jar' server/_crafty/remove-mods.txt
          grep -Fxq 'morehitboxes-forge-1.20.1-1.9.2.1.jar' server/_crafty/remove-mods.txt

      - name: Build corrected client and server downloads
        shell: bash
        run: |
          set -euo pipefail
          VERSION='0.1.9-46'
          JAR='morehitboxes-forge-1.20.1-1.9.2.2.jar'
          mkdir -p dist

          rm -f \
            "dist/Amber-and-Arcana-${VERSION}-Client.zip" \
            "dist/Amber-and-Arcana-${VERSION}-Server.zip" \
            "dist/Amber-and-Arcana-${VERSION}-Crafty-Update-Overlay.zip" \
            "dist/Amber-and-Arcana-${VERSION}-Crafty-JEI-Overlay.zip" \
            "dist/Amber-and-Arcana-${VERSION}-Crafty-Quest-Overlay.zip" \
            "dist/Amber-and-Arcana-${VERSION}-Crafty-Quest-Spawn-Balance-Overlay.zip"

          (cd client && zip -qr "../dist/Amber-and-Arcana-${VERSION}-Client.zip" .)
          (cd server && zip -qr "../dist/Amber-and-Arcana-${VERSION}-Server.zip" .)

          (
            cd server
            zip -qr "../dist/Amber-and-Arcana-${VERSION}-Crafty-Update-Overlay.zip" \
              AmberArcana-Crafty-Launcher.jar \
              _crafty/server-mods.tsv \
              _crafty/remove-mods.txt \
              "mods/$JAR" \
              config/ftbquests/quests \
              kubejs/data \
              kubejs/assets \
              _crafty/build-summary.json \
              pack-information/validation.json
          )
          cp "dist/Amber-and-Arcana-${VERSION}-Crafty-Update-Overlay.zip" \
             "dist/Amber-and-Arcana-${VERSION}-Crafty-JEI-Overlay.zip"

          (cd server && zip -qr "../dist/Amber-and-Arcana-${VERSION}-Crafty-Quest-Overlay.zip" config/ftbquests/quests)

          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/config/ftbquests" "$tmp/kubejs/server_scripts"
          cp -a server/config/ftbquests/quests "$tmp/config/ftbquests/"
          cp overlays/spawn-balance/kubejs/server_scripts/amber_arcana_spawn_balance.js "$tmp/kubejs/server_scripts/"
          cp overlays/spawn-balance/README-SPAWN-BALANCE.txt "$tmp/README-SPAWN-BALANCE.txt"
          (cd "$tmp" && zip -qr "$GITHUB_WORKSPACE/dist/Amber-and-Arcana-${VERSION}-Crafty-Quest-Spawn-Balance-Overlay.zip" .)
          rm -rf "$tmp"
          trap - EXIT

          (
            cd dist
            sha256sum \
              "Amber-and-Arcana-${VERSION}-Client.zip" \
              "Amber-and-Arcana-${VERSION}-Server.zip" \
              "Amber-and-Arcana-${VERSION}-Crafty-Update-Overlay.zip" \
              "Amber-and-Arcana-${VERSION}-Crafty-JEI-Overlay.zip" \
              "Amber-and-Arcana-${VERSION}-Crafty-Quest-Overlay.zip" \
              "Amber-and-Arcana-${VERSION}-Crafty-Quest-Spawn-Balance-Overlay.zip" \
              > SHA256SUMS.txt
          )

      - name: Verify corrected downloads
        shell: bash
        run: |
          set -euo pipefail
          VERSION='0.1.9-46'
          JAR='morehitboxes-forge-1.20.1-1.9.2.2.jar'

          unzip -tq "dist/Amber-and-Arcana-${VERSION}-Client.zip"
          unzip -tq "dist/Amber-and-Arcana-${VERSION}-Server.zip"
          unzip -tq "dist/Amber-and-Arcana-${VERSION}-Crafty-Update-Overlay.zip"

          test "$(unzip -Z1 "dist/Amber-and-Arcana-${VERSION}-Client.zip" | grep -Fxc "overrides/mods/$JAR")" = '1'
          test "$(unzip -Z1 "dist/Amber-and-Arcana-${VERSION}-Server.zip" | grep -Fxc "mods/$JAR")" = '1'
          test "$(unzip -Z1 "dist/Amber-and-Arcana-${VERSION}-Crafty-Update-Overlay.zip" | grep -Fxc "mods/$JAR")" = '1'

          ! unzip -p "dist/Amber-and-Arcana-${VERSION}-Server.zip" _crafty/server-mods.tsv | grep -Fq 'morehitboxes'
          ! unzip -p "dist/Amber-and-Arcana-${VERSION}-Server.zip" _crafty/server-mods.tsv | awk -F '\t' '$1 == "0" {bad=1} END {exit bad ? 0 : 1}'

          unzip -p "dist/Amber-and-Arcana-${VERSION}-Client.zip" manifest.json | jq -e '.version == "0.1.9-46"' >/dev/null
          unzip -p "dist/Amber-and-Arcana-${VERSION}-Server.zip" _crafty/build-summary.json | jq -e '.pack_version == "0.1.9-46"' >/dev/null

          (cd dist && sha256sum -c SHA256SUMS.txt)

      - name: Commit corrected 0.1.9-46 downloads to branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          git add \
            README.md CHANGELOG.md \
            client/manifest.json client/overrides/mods \
            server/_crafty/server-mods.tsv server/_crafty/build-summary.json server/_crafty/remove-mods.txt \
            server/pack-information/validation.json server/mods \
            scripts/validate.sh \
            dist/Amber-and-Arcana-0.1.9-46-Client.zip \
            dist/Amber-and-Arcana-0.1.9-46-Server.zip \
            dist/Amber-and-Arcana-0.1.9-46-Crafty-Update-Overlay.zip \
            dist/Amber-and-Arcana-0.1.9-46-Crafty-JEI-Overlay.zip \
            dist/Amber-and-Arcana-0.1.9-46-Crafty-Quest-Overlay.zip \
            dist/Amber-and-Arcana-0.1.9-46-Crafty-Quest-Spawn-Balance-Overlay.zip \
            dist/SHA256SUMS.txt

          if git diff --cached --quiet; then
            echo 'Nothing changed.'
          else
            git commit -m 'Publish corrected Amber & Arcana 0.1.9-46 client/server downloads [skip ci]'
            git push origin HEAD:experiment/morehitboxes-perf-v2
          fi

      - name: Upload 0.1.9-46 package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: amber-arcana-0.1.9-46
          path: |
            dist/Amber-and-Arcana-0.1.9-46-Client.zip
            dist/Amber-and-Arcana-0.1.9-46-Server.zip
            dist/Amber-and-Arcana-0.1.9-46-Crafty-Update-Overlay.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
