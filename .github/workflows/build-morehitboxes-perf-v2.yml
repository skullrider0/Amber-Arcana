name: Build MoreHitboxes performance v2

on:
  push:
    branches:
      - experiment/morehitboxes-perf-v2
    paths:
      - patches/morehitboxes-1.9.2-performance-v2/**
      - .github/workflows/build-morehitboxes-perf-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Amber & Arcana experiment
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout exact MoreHitboxes 1.9.2 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/DarkPred/MoreHitboxes.git upstream-morehitboxes
          cd upstream-morehitboxes
          git checkout bbe929da2bb5480e83ba266bf3138e431f196d3f
          test "$(git rev-parse HEAD)" = "bbe929da2bb5480e83ba266bf3138e431f196d3f"
          grep -Fxq 'mod_version=1.9.2' gradle.properties

      - name: Install Spark-driven performance v2 source overrides
        shell: bash
        run: |
          set -euo pipefail
          cp patches/morehitboxes-1.9.2-performance-v2/LevelMixin.java \
            upstream-morehitboxes/forge/src/main/java/com/github/darkpred/morehitboxes/mixin/LevelMixin.java
          cp patches/morehitboxes-1.9.2-performance-v2/MultiPart.java \
            upstream-morehitboxes/common/src/main/java/com/github/darkpred/morehitboxes/api/MultiPart.java
          cd upstream-morehitboxes
          sed -i 's/^mod_version=.*/mod_version=1.9.2.2/' gradle.properties
          grep -Fq 'Amber performance v2 intentionally does not inject' forge/src/main/java/com/github/darkpred/morehitboxes/mixin/LevelMixin.java
          ! grep -Fq 'getEntities(Lnet/minecraft/world/level/entity/EntityTypeTest;' forge/src/main/java/com/github/darkpred/morehitboxes/mixin/LevelMixin.java
          grep -Fq 'calculated hitbox position is exactly unchanged' common/src/main/java/com/github/darkpred/morehitboxes/api/MultiPart.java
          git diff --check
          git diff --stat

      - name: Build patched classes
        shell: bash
        run: |
          set -euo pipefail
          cd upstream-morehitboxes
          chmod +x gradlew
          ./gradlew :forge:build --no-daemon \
            -PMODRINTH_TOKEN=ci-placeholder \
            -PCURSEFORGE_TOKEN=ci-placeholder \
            -Pcloudsmith_username=ci-placeholder \
            -Pcloudsmith_token=ci-placeholder
          test -f forge/build/libs/morehitboxes-forge-1.20.1-1.9.2.2.jar

      - name: Preserve official 1.9.2 client mixins and transplant performance classes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out transplant/com/github/darkpred/morehitboxes/mixin transplant/com/github/darkpred/morehitboxes/api

          OFFICIAL='out/morehitboxes-official-1.20.1-1.9.2.jar'
          FINAL='out/morehitboxes-forge-1.20.1-1.9.2.2.jar'
          REBUILT='upstream-morehitboxes/forge/build/libs/morehitboxes-forge-1.20.1-1.9.2.2.jar'
          EXPECTED_SHA512='4540869971009de3cc2c895a61fa1b84a715245202788df7124b6f5a31b82ca9854a2f1a8f14e8033d24669557cf31469d7ce61a0a4c68e90f3cfb83acc007f9'

          curl --fail --location --retry 3 \
            'https://www.cursemaven.com/curse/maven/more-hitboxes-1115989/6942239/more-hitboxes-1115989-6942239.jar' \
            --output "$OFFICIAL"

          printf '%s  %s\n' "$EXPECTED_SHA512" "$OFFICIAL" | sha512sum --check -
          cp "$OFFICIAL" "$FINAL"

          unzip -p "$REBUILT" 'com/github/darkpred/morehitboxes/mixin/LevelMixin.class' \
            > transplant/com/github/darkpred/morehitboxes/mixin/LevelMixin.class
          unzip -p "$REBUILT" 'com/github/darkpred/morehitboxes/api/MultiPart.class' \
            > transplant/com/github/darkpred/morehitboxes/api/MultiPart.class

          test -s transplant/com/github/darkpred/morehitboxes/mixin/LevelMixin.class
          test -s transplant/com/github/darkpred/morehitboxes/api/MultiPart.class

          OFFICIAL_MINECRAFT_MIXIN_SHA="$(unzip -p "$OFFICIAL" 'com/github/darkpred/morehitboxes/mixin/MinecraftMixin.class' | sha256sum | awk '{print $1}')"
          OFFICIAL_REFMAP_SHA="$(unzip -p "$OFFICIAL" 'mixins.morehitboxes.refmap.json' | sha256sum | awk '{print $1}')"

          (cd transplant && zip -q -u "../$FINAL" \
            com/github/darkpred/morehitboxes/mixin/LevelMixin.class \
            com/github/darkpred/morehitboxes/api/MultiPart.class)

          FINAL_MINECRAFT_MIXIN_SHA="$(unzip -p "$FINAL" 'com/github/darkpred/morehitboxes/mixin/MinecraftMixin.class' | sha256sum | awk '{print $1}')"
          FINAL_REFMAP_SHA="$(unzip -p "$FINAL" 'mixins.morehitboxes.refmap.json' | sha256sum | awk '{print $1}')"
          test "$OFFICIAL_MINECRAFT_MIXIN_SHA" = "$FINAL_MINECRAFT_MIXIN_SHA"
          test "$OFFICIAL_REFMAP_SHA" = "$FINAL_REFMAP_SHA"

          test "$(unzip -p "$OFFICIAL" 'com/github/darkpred/morehitboxes/mixin/LevelMixin.class' | sha256sum | awk '{print $1}')" != \
               "$(unzip -p "$FINAL" 'com/github/darkpred/morehitboxes/mixin/LevelMixin.class' | sha256sum | awk '{print $1}')"
          test "$(unzip -p "$OFFICIAL" 'com/github/darkpred/morehitboxes/api/MultiPart.class' | sha256sum | awk '{print $1}')" != \
               "$(unzip -p "$FINAL" 'com/github/darkpred/morehitboxes/api/MultiPart.class' | sha256sum | awk '{print $1}')"

          rm -f "$OFFICIAL"
          sha256sum "$FINAL" | tee out/SHA256SUMS.txt
          sha512sum "$FINAL" | tee out/SHA512SUMS.txt

      - name: Pin Crafty to MoreHitboxes 1.9.2.2 and clean stale versions
        shell: bash
        run: |
          set -euo pipefail
          JAR='out/morehitboxes-forge-1.20.1-1.9.2.2.jar'
          SHA512="$(sha512sum "$JAR" | awk '{print $1}')"
          python3 - "$SHA512" <<'PY'
          from pathlib import Path
          import sys

          sha512 = sys.argv[1]
          tsv = Path('server/_crafty/server-mods.tsv')
          lines = tsv.read_text(encoding='utf-8').splitlines()
          out = []
          found = 0
          for line in lines:
              if not line or line.startswith('#'):
                  out.append(line)
                  continue
              fields = line.split('\t')
              if len(fields) >= 5 and (fields[3] == 'more-hitboxes' or fields[1].startswith('morehitboxes-forge-1.20.1-')):
                  fields[0] = '0'
                  fields[1] = 'morehitboxes-forge-1.20.1-1.9.2.2.jar'
                  fields[2] = sha512
                  fields[3] = 'more-hitboxes'
                  fields[4] = 'More Hitboxes (Amber performance patch v2)'
                  if len(fields) >= 6:
                      fields[5] = '0'
                  out.append('\t'.join(fields))
                  found += 1
              else:
                  out.append(line)
          if found != 1:
              raise SystemExit(f'Expected exactly one More Hitboxes row, found {found}')
          tsv.write_text('\n'.join(out) + '\n', encoding='utf-8')

          remove = Path('server/_crafty/remove-mods.txt')
          old_jars = {
              'morehitboxes-forge-1.20.1-1.9.2.jar',
              'morehitboxes-forge-1.20.1-1.9.2.1.jar',
          }
          cleaned = []
          for line in remove.read_text(encoding='utf-8').splitlines():
              if line in old_jars:
                  continue
              if line.startswith('# Replaced by Amber MoreHitboxes') or line.startswith('# Replaced by Amber More Hitboxes'):
                  continue
              cleaned.append(line)
          while cleaned and cleaned[-1] == '':
              cleaned.pop()
          cleaned += [
              '',
              '# Replaced by Amber More Hitboxes 1.9.2.2 performance patch.',
              'morehitboxes-forge-1.20.1-1.9.2.jar',
              'morehitboxes-forge-1.20.1-1.9.2.1.jar',
          ]
          remove.write_text('\n'.join(cleaned) + '\n', encoding='utf-8')
          PY

          grep -F $'0\tmorehitboxes-forge-1.20.1-1.9.2.2.jar\t' server/_crafty/server-mods.tsv
          grep -Fxq 'morehitboxes-forge-1.20.1-1.9.2.jar' server/_crafty/remove-mods.txt
          grep -Fxq 'morehitboxes-forge-1.20.1-1.9.2.1.jar' server/_crafty/remove-mods.txt

      - name: Persist tested client-safe jar for pack releases
        shell: bash
        run: |
          set -euo pipefail
          DEST='vendor/morehitboxes/1.9.2.2'
          mkdir -p "$DEST"
          cp out/morehitboxes-forge-1.20.1-1.9.2.2.jar "$DEST/"
          cp upstream-morehitboxes/LICENSE vendor/morehitboxes/LICENSE-DarkPred-MoreHitboxes.txt
          sha256sum "$DEST/morehitboxes-forge-1.20.1-1.9.2.2.jar" > "$DEST/SHA256SUMS.txt"
          sha512sum "$DEST/morehitboxes-forge-1.20.1-1.9.2.2.jar" > "$DEST/SHA512SUMS.txt"

      - name: Build Crafty v2 overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf crafty-overlay
          mkdir -p crafty-overlay/_crafty crafty-overlay/mods
          cp server/_crafty/server-mods.tsv crafty-overlay/_crafty/server-mods.tsv
          cp server/_crafty/remove-mods.txt crafty-overlay/_crafty/remove-mods.txt
          cp out/morehitboxes-forge-1.20.1-1.9.2.2.jar crafty-overlay/mods/
          (cd crafty-overlay && zip -qr ../out/Amber-and-Arcana-MoreHitboxes-1.9.2.2-Crafty-Overlay.zip .)

      - name: Commit tested v2 inputs back to experiment branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/_crafty/server-mods.tsv server/_crafty/remove-mods.txt vendor/morehitboxes
          if ! git diff --cached --quiet; then
            git commit -m 'Persist Spark-verified MoreHitboxes 1.9.2.2 build [skip ci]'
            git push origin HEAD:experiment/morehitboxes-perf-v2
          fi

      - name: Upload patched jar and Crafty overlay
        uses: actions/upload-artifact@v4
        with:
          name: morehitboxes-1.9.2.2-amber-perf-v2
          path: out/*
          if-no-files-found: error
