name: Finalize Amber & Arcana 0.1.9-46 publication

on:
  push:
    branches:
      - experiment/morehitboxes-perf-v2
    paths:
      - .github/workflows/finalize-0.1.9-46.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix canonical CI pin and release metadata
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          ci = Path('.github/workflows/validate-pack.yml')
          text = ci.read_text(encoding='utf-8')
          old = """          jar='morehitboxes-forge-1.20.1-1.9.2.1.jar'\n          source=\"vendor/morehitboxes/1.9.2.1/$jar\"\n          test -f \"$source\"\n          mkdir -p client/overrides/mods server/mods\n          cp \"$source\" \"client/overrides/mods/$jar\"\n          cp \"$source\" \"server/mods/$jar\"\n"""
          new = """          jar='morehitboxes-forge-1.20.1-1.9.2.2.jar'\n          source=\"vendor/morehitboxes/1.9.2.2/$jar\"\n          test -f \"$source\"\n          mkdir -p client/overrides/mods server/mods\n          rm -f \\\n            client/overrides/mods/morehitboxes-forge-1.20.1-1.9.2.jar \\\n            client/overrides/mods/morehitboxes-forge-1.20.1-1.9.2.1.jar \\\n            server/mods/morehitboxes-forge-1.20.1-1.9.2.jar \\\n            server/mods/morehitboxes-forge-1.20.1-1.9.2.1.jar\n          cp \"$source\" \"client/overrides/mods/$jar\"\n          cp \"$source\" \"server/mods/$jar\"\n          ! grep -Fq 'morehitboxes' server/_crafty/server-mods.tsv\n          ! awk -F '\\t' '$1 == \"0\" {bad=1} END {exit bad ? 0 : 1}' server/_crafty/server-mods.tsv\n"""
          if old not in text:
              raise SystemExit('Expected stale 1.9.2.1 CI block was not found')
          ci.write_text(text.replace(old, new, 1), encoding='utf-8')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old_count = '| Server managed mod entries | 271 |'
          if old_count not in text:
              raise SystemExit('Expected README managed-mod count not found')
          text = text.replace(old_count, '| Server managed mod entries | 270 |', 1)
          text = text.replace('The 1.9.2.1 patch reduces unnecessary work without removing multipart Fossils support', 'The 1.9.2.2 patch removes the Spark-identified global typed entity-query scan while retaining multipart Fossils support', 1)
          text = text.replace('superseded by the client-safe 1.9.2.1 performance patch in 0.1.9-24', 'superseded by the client-safe 1.9.2.2 performance patch in 0.1.9-46', 1)
          readme.write_text(text, encoding='utf-8')
          PY

          grep -Fq "jar='morehitboxes-forge-1.20.1-1.9.2.2.jar'" .github/workflows/validate-pack.yml
          grep -Fq 'source="vendor/morehitboxes/1.9.2.2/$jar"' .github/workflows/validate-pack.yml
          ! grep -Fq "jar='morehitboxes-forge-1.20.1-1.9.2.1.jar'" .github/workflows/validate-pack.yml
          grep -Fq '| Server managed mod entries | 270 |' README.md
          ! grep -Fq 'morehitboxes' server/_crafty/server-mods.tsv
          if awk -F '\t' '$1 == "0" {print; bad=1} END {exit bad ? 0 : 1}' server/_crafty/server-mods.tsv; then
            echo 'fileID=0 row remains in server-mods.tsv' >&2
            exit 1
          fi

      - name: Commit final publication safeguards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/validate-pack.yml README.md
          if git diff --cached --quiet; then
            echo 'No publication safeguard changes needed.'
          else
            git commit -m 'Finalize 0.1.9-46 publication safeguards [skip ci]'
            git push origin HEAD:experiment/morehitboxes-perf-v2
          fi
