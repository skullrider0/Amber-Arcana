name: Build and validate pack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build and validation tools
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep unzip zip

      - name: Apply idempotent Mekanism JEI compatibility hotfix
        run: python3 scripts/hotfix-jei-mekanism-compat.py

      - name: Apply 0.1.9-17 content cleanup
        run: python3 scripts/hotfix-content-cleanup-0.1.9-17.py

      - name: Apply 0.1.9-18 JEI dependency compatibility fix
        run: python3 scripts/hotfix-jei-required-minimum-0.1.9-18.py

      - name: Apply 0.1.9-19 server JEI and Crafty overlay
        run: python3 scripts/hotfix-server-jei-0.1.9-19.py

      - name: Apply 0.1.9-21 More Hitboxes dependency baseline
        run: python3 scripts/hotfix-restore-more-hitboxes-0.1.9-21.py

      - name: Stage client-safe More Hitboxes performance jar
        shell: bash
        run: |
          set -euo pipefail
          jar='morehitboxes-forge-1.20.1-1.9.2.1.jar'
          source="vendor/morehitboxes/1.9.2.1/$jar"
          test -f "$source"
          mkdir -p client/overrides/mods server/mods
          cp "$source" "client/overrides/mods/$jar"
          cp "$source" "server/mods/$jar"

      - name: Apply 0.1.9-22 More Hitboxes performance release
        run: python3 scripts/hotfix-morehitboxes-perf-0.1.9-22.py

      - name: Apply 0.1.9-23 live FTB Quests sync
        run: python3 scripts/hotfix-quest-sync-0.1.9-23.py

      - name: Assemble 0.1.9-24 quest hotfix
        shell: bash
        run: cat scripts/quest24-parts/*.part > scripts/hotfix-quest-requirements-0.1.9-24.py

      - name: Apply 0.1.9-24 completed quest progression
        run: python3 scripts/hotfix-quest-requirements-0.1.9-24.py

      - name: Finalize 0.1.9-25 quest runtime format and progression
        run: python3 scripts/hotfix-quest-finalize-0.1.9-25.py

      - name: Normalize 0.1.9-25 validation version
        shell: bash
        run: |
          sed -i -E 's/0\.1\.9-[0-9]+/0.1.9-25/g' scripts/validate.sh
          sed -i 's/rg -F "item: "$item""/rg -F "$item"/' scripts/validate.sh

      - name: Build client and server distributions
        run: bash scripts/build.sh

      - name: Validate sources and release archives
        run: bash scripts/validate.sh

      - name: Publish rebuilt distributions to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Release files already current."
            exit 0
          fi
          version="$(jq -r '.version' client/manifest.json)"
          git commit -m "Publish Amber & Arcana ${version} [skip ci]"
          git push origin HEAD:main
