name: Build and validate pack

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build and validation tools
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep unzip zip

      - name: Verify canonical current source
        shell: bash
        run: |
          set -euo pipefail
          test -d client/overrides/config/ftbquests/quests/chapters
          test -d server/config/ftbquests/quests/chapters
          client_chapters="$(find client/overrides/config/ftbquests/quests/chapters -maxdepth 1 -name '*.snbt' -type f | wc -l)"
          server_chapters="$(find server/config/ftbquests/quests/chapters -maxdepth 1 -name '*.snbt' -type f | wc -l)"
          test "$client_chapters" = "$server_chapters"
          case "$client_chapters" in
            26|28) ;;
            *) echo "Expected canonical quest source with 26 pre-0.1.9-38 chapters or 28 post-0.1.9-38 chapters; found $client_chapters" >&2; exit 1 ;;
          esac
          jar='morehitboxes-forge-1.20.1-1.9.2.2.jar'
          source="vendor/morehitboxes/1.9.2.2/$jar"
          test -f "$source"
          mkdir -p client/overrides/mods server/mods
          cp "$source" "client/overrides/mods/$jar"
          cp "$source" "server/mods/$jar"

      - name: Build client and server distributions
        run: bash scripts/build.sh

      - name: Validate sources and release archives
        run: bash scripts/validate.sh

      - name: Publish rebuilt distributions to main
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Release files already current."
            exit 0
          fi
          version="$(jq -r '.version' client/manifest.json)"
          git commit -m "Publish Amber & Arcana ${version} [skip ci]"
          git push origin HEAD:main
