name: Build and validate pack

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build and validation tools
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep unzip zip

      - name: Verify canonical current source
        shell: bash
        run: |
          set -euo pipefail
          test -d client/overrides/config/ftbquests/quests/chapters
          test -d server/config/ftbquests/quests/chapters
          test "$(find client/overrides/config/ftbquests/quests/chapters -maxdepth 1 -name '*.snbt' -type f | wc -l)" = "26"
          test "$(find server/config/ftbquests/quests/chapters -maxdepth 1 -name '*.snbt' -type f | wc -l)" = "26"
          jar='morehitboxes-forge-1.20.1-1.9.2.1.jar'
          source="vendor/morehitboxes/1.9.2.1/$jar"
          test -f "$source"
          mkdir -p client/overrides/mods server/mods
          cp "$source" "client/overrides/mods/$jar"
          cp "$source" "server/mods/$jar"

      # The repository now stores the canonical current pack source. Historical
      # release transformers are intentionally not replayed here: newer quest
      # releases substantially deepen the old chapters, and re-running 0.1.9-24
      # over those current files can destroy the modern quest graph. build.sh
      # contains the idempotent current release passes (0.1.9-30 onward).
      - name: Build client and server distributions
        run: bash scripts/build.sh

      - name: Validate sources and release archives
        run: bash scripts/validate.sh

      - name: Publish rebuilt distributions to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Release files already current."
            exit 0
          fi
          version="$(jq -r '.version' client/manifest.json)"
          git commit -m "Publish Amber & Arcana ${version} [skip ci]"
          git push origin HEAD:main
