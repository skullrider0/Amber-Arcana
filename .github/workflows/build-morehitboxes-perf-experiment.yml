name: Build MoreHitboxes performance experiment

on:
  push:
    branches:
      - experiment/morehitboxes-perf-v1
    paths:
      - patches/morehitboxes-1.9.2-performance-v1/**
      - .github/workflows/build-morehitboxes-perf-experiment.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Amber & Arcana experiment
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout exact MoreHitboxes 1.9.2 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/DarkPred/MoreHitboxes.git upstream-morehitboxes
          cd upstream-morehitboxes
          git checkout bbe929da2bb5480e83ba266bf3138e431f196d3f
          test "$(git rev-parse HEAD)" = "bbe929da2bb5480e83ba266bf3138e431f196d3f"
          grep -Fxq 'mod_version=1.9.2' gradle.properties

      - name: Install performance source overrides
        shell: bash
        run: |
          set -euo pipefail
          cp patches/morehitboxes-1.9.2-performance-v1/LevelMixin.java \
            upstream-morehitboxes/forge/src/main/java/com/github/darkpred/morehitboxes/mixin/LevelMixin.java
          cp patches/morehitboxes-1.9.2-performance-v1/MultiPart.java \
            upstream-morehitboxes/common/src/main/java/com/github/darkpred/morehitboxes/api/MultiPart.java
          cd upstream-morehitboxes
          sed -i 's/^mod_version=.*/mod_version=1.9.2.1/' gradle.properties
          grep -Fq 'Reject distant parts before doing' forge/src/main/java/com/github/darkpred/morehitboxes/mixin/LevelMixin.java
          grep -Fq 'calculated hitbox position is exactly unchanged' common/src/main/java/com/github/darkpred/morehitboxes/api/MultiPart.java
          git diff --check
          git diff --stat

      - name: Build Forge jar
        shell: bash
        run: |
          set -euo pipefail
          cd upstream-morehitboxes
          chmod +x gradlew
          ./gradlew :forge:build --no-daemon \
            -PMODRINTH_TOKEN=ci-placeholder \
            -PCURSEFORGE_TOKEN=ci-placeholder \
            -Pcloudsmith_username=ci-placeholder \
            -Pcloudsmith_token=ci-placeholder
          mkdir -p ../out
          find forge/build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*sources*' ! -name '*javadoc*' -print -exec cp {} ../out/ \;
          test -f ../out/morehitboxes-forge-1.20.1-1.9.2.1.jar
          sha256sum ../out/*.jar | tee ../out/SHA256SUMS.txt

      - name: Pin Crafty to the patched MoreHitboxes jar
        shell: bash
        run: |
          set -euo pipefail
          JAR='out/morehitboxes-forge-1.20.1-1.9.2.1.jar'
          SHA512="$(sha512sum "$JAR" | awk '{print $1}')"
          python3 - "$SHA512" <<'PY'
          from pathlib import Path
          import sys

          sha512 = sys.argv[1]
          tsv = Path('server/_crafty/server-mods.tsv')
          lines = tsv.read_text(encoding='utf-8').splitlines()
          out = []
          found = 0
          for line in lines:
              if not line or line.startswith('#'):
                  out.append(line)
                  continue
              fields = line.split('\t')
              if len(fields) == 5 and (fields[3] == 'more-hitboxes' or fields[1].startswith('morehitboxes-forge-1.20.1-')):
                  out.append('\t'.join([
                      '0',
                      'morehitboxes-forge-1.20.1-1.9.2.1.jar',
                      sha512,
                      'more-hitboxes',
                      'More Hitboxes (Amber performance beta)'
                  ]))
                  found += 1
              else:
                  out.append(line)
          if found != 1:
              raise SystemExit(f'Expected exactly one More Hitboxes row, found {found}')
          tsv.write_text('\n'.join(out) + '\n', encoding='utf-8')

          remove = Path('server/_crafty/remove-mods.txt')
          old = 'morehitboxes-forge-1.20.1-1.9.2.jar'
          text = remove.read_text(encoding='utf-8')
          if old not in text.splitlines():
              text = text.rstrip() + '\n\n# Replaced by Amber MoreHitboxes 1.9.2.1 performance beta.\n' + old + '\n'
              remove.write_text(text, encoding='utf-8')
          PY

          grep -F $'0\tmorehitboxes-forge-1.20.1-1.9.2.1.jar\t' server/_crafty/server-mods.tsv
          ! grep -Fq $'6942239\tmorehitboxes-forge-1.20.1-1.9.2.jar\t' server/_crafty/server-mods.tsv
          grep -Fxq 'morehitboxes-forge-1.20.1-1.9.2.jar' server/_crafty/remove-mods.txt

      - name: Build Crafty beta overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf crafty-overlay
          mkdir -p crafty-overlay/_crafty crafty-overlay/mods
          cp server/_crafty/server-mods.tsv crafty-overlay/_crafty/server-mods.tsv
          cp server/_crafty/remove-mods.txt crafty-overlay/_crafty/remove-mods.txt
          cp out/morehitboxes-forge-1.20.1-1.9.2.1.jar crafty-overlay/mods/
          (cd crafty-overlay && zip -qr ../out/Amber-and-Arcana-MoreHitboxes-1.9.2.1-Crafty-Overlay.zip .)

      - name: Commit Crafty pin back to experiment branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/_crafty/server-mods.tsv server/_crafty/remove-mods.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Pin Crafty to MoreHitboxes 1.9.2.1 beta [skip ci]'
            git push origin HEAD:experiment/morehitboxes-perf-v1
          fi

      - name: Upload patched jar and Crafty overlay
        uses: actions/upload-artifact@v4
        with:
          name: morehitboxes-1.9.2.1-amber-perf-v1
          path: out/*
          if-no-files-found: error
