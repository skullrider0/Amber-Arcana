name: Build MoreHitboxes performance experiment

on:
  push:
    branches:
      - agent/morehitboxes-spatial-v3
    paths:
      - patches/morehitboxes-1.9.2-performance-v3/**
      - .github/workflows/build-morehitboxes-perf-experiment.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Amber & Arcana experiment
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Checkout exact MoreHitboxes 1.9.2 source
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/DarkPred/MoreHitboxes.git upstream-morehitboxes
          cd upstream-morehitboxes
          git checkout bbe929da2bb5480e83ba266bf3138e431f196d3f
          test "$(git rev-parse HEAD)" = "bbe929da2bb5480e83ba266bf3138e431f196d3f"
          grep -Fxq 'mod_version=1.9.2' gradle.properties

      - name: Install performance source overrides
        shell: bash
        run: |
          set -euo pipefail
          cp patches/morehitboxes-1.9.2-performance-v3/LevelMixin.java \
            upstream-morehitboxes/forge/src/main/java/com/github/darkpred/morehitboxes/mixin/LevelMixin.java
          cp patches/morehitboxes-1.9.2-performance-v3/MultiPart.java \
            upstream-morehitboxes/common/src/main/java/com/github/darkpred/morehitboxes/api/MultiPart.java
          cd upstream-morehitboxes
          sed -i 's/^mod_version=.*/mod_version=1.9.2.3/' gradle.properties
          grep -Fq 'Build a spatial index once per game tick' forge/src/main/java/com/github/darkpred/morehitboxes/mixin/LevelMixin.java
          grep -Fq 'calculated hitbox position is exactly unchanged' common/src/main/java/com/github/darkpred/morehitboxes/api/MultiPart.java
          git diff --check
          git diff --stat

      - name: Build patched classes
        shell: bash
        run: |
          set -euo pipefail
          cd upstream-morehitboxes
          chmod +x gradlew
          ./gradlew :forge:build --no-daemon \
            -PMODRINTH_TOKEN=ci-placeholder \
            -PCURSEFORGE_TOKEN=ci-placeholder \
            -Pcloudsmith_username=ci-placeholder \
            -Pcloudsmith_token=ci-placeholder
          test -f forge/build/libs/morehitboxes-forge-1.20.1-1.9.2.3.jar

      - name: Preserve official 1.9.2 client mixins and transplant performance classes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out transplant/com/github/darkpred/morehitboxes/mixin transplant/com/github/darkpred/morehitboxes/api

          OFFICIAL='out/morehitboxes-official-1.20.1-1.9.2.jar'
          FINAL='out/morehitboxes-forge-1.20.1-1.9.2.3.jar'
          REBUILT='upstream-morehitboxes/forge/build/libs/morehitboxes-forge-1.20.1-1.9.2.3.jar'
          EXPECTED_SHA512='4540869971009de3cc2c895a61fa1b84a715245202788df7124b6f5a31b82ca9854a2f1a8f14e8033d24669557cf31469d7ce61a0a4c68e90f3cfb83acc007f9'

          curl --fail --location --retry 3 \
            'https://www.cursemaven.com/curse/maven/more-hitboxes-1115989/6942239/more-hitboxes-1115989-6942239.jar' \
            --output "$OFFICIAL"

          printf '%s  %s\n' "$EXPECTED_SHA512" "$OFFICIAL" | sha512sum --check -
          cp "$OFFICIAL" "$FINAL"

          unzip -p "$REBUILT" 'com/github/darkpred/morehitboxes/mixin/LevelMixin.class' \
            > transplant/com/github/darkpred/morehitboxes/mixin/LevelMixin.class
          unzip -p "$REBUILT" 'com/github/darkpred/morehitboxes/api/MultiPart.class' \
            > transplant/com/github/darkpred/morehitboxes/api/MultiPart.class

          test -s transplant/com/github/darkpred/morehitboxes/mixin/LevelMixin.class
          test -s transplant/com/github/darkpred/morehitboxes/api/MultiPart.class

          # Keep every untouched class and the original Mixin refmap exactly as shipped by More Hitboxes 1.9.2.
          OFFICIAL_MINECRAFT_MIXIN_SHA="$(unzip -p "$OFFICIAL" 'com/github/darkpred/morehitboxes/mixin/MinecraftMixin.class' | sha256sum | awk '{print $1}')"
          OFFICIAL_REFMAP_SHA="$(unzip -p "$OFFICIAL" 'mixins.morehitboxes.refmap.json' | sha256sum | awk '{print $1}')"

          (cd transplant && zip -q -u "../$FINAL" \
            com/github/darkpred/morehitboxes/mixin/LevelMixin.class \
            com/github/darkpred/morehitboxes/api/MultiPart.class)

          FINAL_MINECRAFT_MIXIN_SHA="$(unzip -p "$FINAL" 'com/github/darkpred/morehitboxes/mixin/MinecraftMixin.class' | sha256sum | awk '{print $1}')"
          FINAL_REFMAP_SHA="$(unzip -p "$FINAL" 'mixins.morehitboxes.refmap.json' | sha256sum | awk '{print $1}')"
          test "$OFFICIAL_MINECRAFT_MIXIN_SHA" = "$FINAL_MINECRAFT_MIXIN_SHA"
          test "$OFFICIAL_REFMAP_SHA" = "$FINAL_REFMAP_SHA"

          # Verify the two intended classes actually differ from the official release.
          test "$(unzip -p "$OFFICIAL" 'com/github/darkpred/morehitboxes/mixin/LevelMixin.class' | sha256sum | awk '{print $1}')" != \
               "$(unzip -p "$FINAL" 'com/github/darkpred/morehitboxes/mixin/LevelMixin.class' | sha256sum | awk '{print $1}')"
          test "$(unzip -p "$OFFICIAL" 'com/github/darkpred/morehitboxes/api/MultiPart.class' | sha256sum | awk '{print $1}')" != \
               "$(unzip -p "$FINAL" 'com/github/darkpred/morehitboxes/api/MultiPart.class' | sha256sum | awk '{print $1}')"

          rm -f "$OFFICIAL"
          sha256sum "$FINAL" | tee out/SHA256SUMS.txt
          sha512sum "$FINAL" | tee out/SHA512SUMS.txt

      - name: Pin Crafty to the patched MoreHitboxes jar
        shell: bash
        run: |
          set -euo pipefail
          JAR='out/morehitboxes-forge-1.20.1-1.9.2.3.jar'
          SHA512="$(sha512sum "$JAR" | awk '{print $1}')"
          python3 - "$SHA512" <<'PY'
          from pathlib import Path
          import sys

          sha512 = sys.argv[1]
          tsv = Path('server/_crafty/server-mods.tsv')
          lines = tsv.read_text(encoding='utf-8').splitlines()
          out = []
          found = 0
          for line in lines:
              if not line or line.startswith('#'):
                  out.append(line)
                  continue
              fields = line.split('\t')
              if len(fields) >= 5 and (fields[3] == 'more-hitboxes' or fields[1].startswith('morehitboxes-forge-1.20.1-')):
                  out.append('\t'.join([
                      '0',
                      'morehitboxes-forge-1.20.1-1.9.2.3.jar',
                      sha512,
                      'more-hitboxes',
                      'More Hitboxes (Amber spatial performance beta)',
                      fields[5] if len(fields) > 5 else '0'
                  ]))
                  found += 1
              else:
                  out.append(line)
          if found != 1:
              raise SystemExit(f'Expected exactly one More Hitboxes row, found {found}')
          tsv.write_text('\n'.join(out) + '\n', encoding='utf-8')

          remove = Path('server/_crafty/remove-mods.txt')
          olds = [
              'morehitboxes-forge-1.20.1-1.9.2.jar',
              'morehitboxes-forge-1.20.1-1.9.2.1.jar',
              'morehitboxes-forge-1.20.1-1.9.2.2.jar',
          ]
          text = remove.read_text(encoding='utf-8')
          lines = text.splitlines()
          missing = [old for old in olds if old not in lines]
          if missing:
              text = text.rstrip() + '\n\n# Replaced by Amber MoreHitboxes 1.9.2.3 spatial performance beta.\n' + '\n'.join(missing) + '\n'
              remove.write_text(text, encoding='utf-8')
          PY

          grep -F $'0\tmorehitboxes-forge-1.20.1-1.9.2.3.jar\t' server/_crafty/server-mods.tsv
          ! grep -Fq $'6942239\tmorehitboxes-forge-1.20.1-1.9.2.jar\t' server/_crafty/server-mods.tsv
          grep -Fxq 'morehitboxes-forge-1.20.1-1.9.2.jar' server/_crafty/remove-mods.txt
          grep -Fxq 'morehitboxes-forge-1.20.1-1.9.2.2.jar' server/_crafty/remove-mods.txt

      - name: Persist tested client-safe jar for pack releases
        shell: bash
        run: |
          set -euo pipefail
          DEST='vendor/morehitboxes/1.9.2.3'
          mkdir -p "$DEST"
          cp out/morehitboxes-forge-1.20.1-1.9.2.3.jar "$DEST/"
          cp upstream-morehitboxes/LICENSE vendor/morehitboxes/LICENSE-DarkPred-MoreHitboxes.txt
          sha256sum "$DEST/morehitboxes-forge-1.20.1-1.9.2.3.jar" > "$DEST/SHA256SUMS.txt"
          sha512sum "$DEST/morehitboxes-forge-1.20.1-1.9.2.3.jar" > "$DEST/SHA512SUMS.txt"

      - name: Build Crafty beta overlay
        shell: bash
        run: |
          set -euo pipefail
          rm -rf crafty-overlay
          mkdir -p crafty-overlay/_crafty crafty-overlay/mods
          cp server/_crafty/server-mods.tsv crafty-overlay/_crafty/server-mods.tsv
          cp server/_crafty/remove-mods.txt crafty-overlay/_crafty/remove-mods.txt
          cp out/morehitboxes-forge-1.20.1-1.9.2.3.jar crafty-overlay/mods/
          (cd crafty-overlay && zip -qr ../out/Amber-and-Arcana-MoreHitboxes-1.9.2.3-Crafty-Overlay.zip .)

      - name: Build isolated client boot-test package
        shell: bash
        run: |
          set -euo pipefail
          BASE='dist/Amber-and-Arcana-0.1.9-50-Client.zip'
          TEST='out/Amber-and-Arcana-0.1.9-50-MoreHitboxes-1.9.2.3-TEST-Client.zip'
          WORK='client-boot-test'

          test -f "$BASE"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          unzip -q "$BASE" -d "$WORK"

          find "$WORK" -type f -name 'morehitboxes-forge-1.20.1-*.jar' -print -delete
          mkdir -p "$WORK/overrides/mods"
          cp out/morehitboxes-forge-1.20.1-1.9.2.3.jar "$WORK/overrides/mods/"

          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = Path('client-boot-test/manifest.json')
          data = json.loads(manifest.read_text(encoding='utf-8'))
          data['name'] = 'Amber & Arcana 0.1.9-50 — MoreHitboxes 1.9.2.3 Boot Test'
          data['version'] = '0.1.9-50-mh-1.9.2.3-test'
          manifest.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

          (cd "$WORK" && zip -qr "../$TEST" .)

          COUNT="$(unzip -l "$TEST" | grep -c 'morehitboxes-forge-1.20.1-.*\.jar')"
          test "$COUNT" = 1
          unzip -l "$TEST" | grep 'overrides/mods/morehitboxes-forge-1.20.1-1.9.2.3.jar'
          ! unzip -l "$TEST" | grep -q 'morehitboxes-forge-1.20.1-1.9.2.2.jar'
          sha256sum "$TEST" | tee out/CLIENT-TEST-SHA256SUMS.txt

      - name: Upload client boot-test ZIP
        uses: actions/upload-artifact@v4
        with:
          name: amber-arcana-0.1.9-50-morehitboxes-1.9.2.3-client-test
          path: out/Amber-and-Arcana-0.1.9-50-MoreHitboxes-1.9.2.3-TEST-Client.zip
          if-no-files-found: error

      - name: Commit tested beta inputs back to experiment branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server/_crafty/server-mods.tsv server/_crafty/remove-mods.txt vendor/morehitboxes
          if ! git diff --cached --quiet; then
            git commit -m 'Persist client-safe MoreHitboxes beta for pack release [skip ci]'
            git push origin HEAD:agent/morehitboxes-spatial-v3
          fi

      - name: Upload patched jar and Crafty overlay
        uses: actions/upload-artifact@v4
        with:
          name: morehitboxes-1.9.2.3-amber-perf-v1
          path: out/*
          if-no-files-found: error
