# Amber & Arcana tuned ServerCore 1.5.2 configuration.
# Caps target the mob-AI saturation seen in 4-player Spark profiles while
# preserving spawner farms and keeping view distance stable.

features:
  prevent-moving-into-unloaded-chunks: true
  autosave-interval-seconds: 600
  xp-merge-fraction: 8
  xp-merge-radius: 3.0
  item-merge-radius: 2.0
  lobotomize-villagers:
    enabled: true
    tick-interval: 20

dynamic:
  enabled: true
  target-mspt: 30
  dynamic-settings:
    # Keep the requested mob caps fixed; do not stack a dynamic percentage on top.
    - setting: 'MOBCAP_PERCENTAGE'
      max: 100
      min: 100
      increment: 1
      interval: 15

    # Reduce active chunk work before touching simulation distance.
    - setting: 'CHUNK_TICK_DISTANCE'
      max: 6
      min: 3
      increment: 1
      interval: 10

    - setting: 'SIMULATION_DISTANCE'
      max: 6
      min: 3
      increment: 1
      interval: 15

    # Preserve an 8-chunk maximum, but shed distant chunk delivery under sustained load.
    - setting: 'VIEW_DISTANCE'
      max: 8
      min: 6
      increment: 1
      interval: 30

breeding-cap:
  enabled: true
  villagers:
    limit: 24
    range: 64
  animals:
    limit: 32
    range: 64

mob-spawning:
  zombie-reinforcements:
    enforce-mobcap: true
    additional-capacity: 16

  nether-portal-randomticks:
    enforce-mobcap: true
    additional-capacity: 16

  # Keep player/dungeon spawners functional even when natural caps are full.
  monster-spawners:
    enforce-mobcap: false
    additional-capacity: 32

  infested:
    enforce-mobcap: true
    additional-capacity: 16

  categories:
    - category: 'MONSTER'
      mobcap: 30
      spawn-interval: 1

    - category: 'CREATURE'
      mobcap: 10
      spawn-interval: 400

    - category: 'AMBIENT'
      mobcap: 15
      spawn-interval: 1

    - category: 'AXOLOTLS'
      mobcap: 5
      spawn-interval: 1

    - category: 'UNDERGROUND_WATER_CREATURE'
      mobcap: 5
      spawn-interval: 1

    - category: 'WATER_CREATURE'
      mobcap: 5
      spawn-interval: 1

    - category: 'WATER_AMBIENT'
      mobcap: 20
      spawn-interval: 1

    - category: 'VAMPIRISM_HUNTER'
      mobcap: 15
      spawn-interval: 1

    - category: 'VAMPIRISM_VAMPIRE'
      mobcap: 10
      spawn-interval: 1

    - category: 'WEREWOLVES_WEREWOLF'
      mobcap: 8
      spawn-interval: 1

    - category: 'RATS'
      mobcap: 25
      spawn-interval: 1

commands:
  status-enabled: true
  mobcaps-enabled: true
  colors:
    primary: 'dark_aqua'
    secondary: 'green'
    tertiary: 'aqua'

# Deliberately left disabled for this modpack. Entity Activation Range is powerful,
# but skipped ticks can break modded mobs/farms. Caps + Mobtimizations are the
# safer first-line fix for the measured AI bottleneck.
activation-range:
  enabled: false
  tick-new-entities: true
  use-vertical-range: false
  skip-non-immune: false
  villager-tick-panic: true
  villager-work-immunity-after: 20
  villager-work-immunity-for: 20
  excluded-entity-types:
    - 'minecraft:ghast'
    - 'minecraft:hopper_minecart'
    - 'minecraft:warden'
  default-activation-type:
    activation-range: 16
    tick-interval: 20
    wakeup-interval: -1
    extra-height-up: false
    extra-height-down: false
  custom-activation-types:
    - name: 'raider'
      activation-range: 48
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: false
      entity-matcher:
        - 'typeof:raider'
    - name: 'water'
      activation-range: 24
      tick-interval: 20
      wakeup-interval: 60
      extra-height-up: false
      extra-height-down: false
      entity-matcher:
        - 'typeof:water_animal'
    - name: 'villager'
      activation-range: 16
      tick-interval: 20
      wakeup-interval: 30
      extra-height-up: false
      extra-height-down: false
      entity-matcher:
        - 'typeof:villager'
    - name: 'zombie'
      activation-range: 16
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: false
      entity-matcher:
        - 'minecraft:zombie'
        - 'minecraft:husk'
    - name: 'monster-below'
      activation-range: 32
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: true
      entity-matcher:
        - 'minecraft:creeper'
        - 'minecraft:slime'
        - 'minecraft:magma_cube'
        - 'minecraft:hoglin'
    - name: 'flying-monster'
      activation-range: 48
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: false
      entity-matcher:
        - 'minecraft:ghast'
        - 'minecraft:phantom'
    - name: 'monster'
      activation-range: 32
      tick-interval: 20
      wakeup-interval: 20
      extra-height-up: true
      extra-height-down: false
      entity-matcher:
        - 'typeof:monster'
    - name: 'animal'
      activation-range: 16
      tick-interval: 20
      wakeup-interval: 60
      extra-height-up: false
      extra-height-down: false
      entity-matcher:
        - 'typeof:animal'
        - 'typeof:ambient'
    - name: 'creature'
      activation-range: 24
      tick-interval: 20
      wakeup-interval: 30
      extra-height-up: false
      extra-height-down: false
      entity-matcher:
        - 'typeof:mob'
